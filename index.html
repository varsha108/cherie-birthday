<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Synced - A Digital Greeting</title>
<style>
:root {
    --paper: #eef2e6;
    --ink: #2f3a33;
    --accent: #e29477;
    --accent-deep: #5d7c67;
    --muted: #7f8c80;
    --mono: 'Lucida Handwriting', 'Lucida Calligraphy', 'Bradley Hand', 'Snell Roundhand', 'Apple Chancery', 'Segoe Script', 'Brush Script MT', cursive;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--mono);
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; overflow-y: auto;
}
body.locked { overflow: hidden; }

#bg-image {
    position: fixed; inset: 0;
    background: url('Flower Brain.jpg') center / cover no-repeat;
    z-index: 0;
}
#bg-image { opacity: 0.9; }
#overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(253,250,246,0.88) 0%, rgba(253,250,246,0.95) 100%);
    z-index: 1;
}
#bg-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 2; pointer-events: none;
}

/* ---------- Poem ---------- */
.content {
    position: relative; z-index: 10;
    width: 100%; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5rem 1.5rem 4rem;
}
.poem-container {
    max-width: 34rem;
    text-align: center;
    font-size: clamp(0.7rem, 3vw, 1.05rem);
    line-height: 2.2;
}
.salutation {
    font-size: 1.5em;
    font-weight: normal;
    margin-bottom: 2.4rem;
    color: var(--accent-deep);
}
.stanza { margin-bottom: 2.4rem; }
.stanza:last-child { margin-bottom: 0; }
.stanza + .stanza::before {
    content: '';
    display: block;
    width: 2.5rem; height: 1px;
    background: var(--accent);
    opacity: 0.45;
    margin: 0 auto 2.4rem;
}

.reveal { opacity: 0; transform: translateY(8px); }
body.open .reveal {
    animation: rise 0.9s ease forwards;
    animation-delay: calc(0.5s + var(--i) * 0.28s);
}
@keyframes rise { to { opacity: 1; transform: none; } }

#memories-trigger {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-style: wavy;
    text-underline-offset: 5px;
    cursor: pointer;
    transition: color 0.3s ease;
    position: relative; z-index: 20;
}
#memories-trigger:hover { color: var(--accent-deep); }

.instruction {
    margin-top: 4rem;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    opacity: 0;
}
body.open .instruction { animation: pulse 2.4s ease-in-out 2.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

/* ---------- Cover & Envelope ---------- */
#cover {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background:
        radial-gradient(ellipse at 30% 20%, rgba(226,148,119,0.16), transparent 55%),
        var(--paper);
    transition: opacity 1.2s ease, transform 1.2s ease;
}
#cover.gone { opacity: 0; transform: scale(0.95); pointer-events: none; }

.envelope {
    position: relative;
    width: min(88vw, 24rem);
    aspect-ratio: 3 / 2;
    background: #d9bba5;
    border: 1px solid rgba(43,38,34,0.25);
    box-shadow: 0 20px 44px rgba(47,58,51,0.2), inset 0 0 15px rgba(0,0,0,0.1);
    perspective: 900px;
    transition: transform 1.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 1.3s ease;
}

    inset: 0;
    z-index: 1;
    touch-action: pan-y;
